name: Deploy to AWS

# Continuous deployment for NEXORA AI on AWS (see docs/deployment/AWS_DEPLOYMENT.md).
# Runs after the CI workflow passes on a push to main, or by hand from the Actions tab.
# It signs in to AWS with GitHub's OIDC token (no stored AWS keys), pushes the Docker image to ECR and
# tells the app server, through Systems Manager, to run the new image. The server rolls back on its own
# if the new image never becomes healthy.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables), printed by infra/aws/bootstrap.sh:
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY, APP_URL. Optional: PROJECT_NAME (default nexora).
# Until AWS_DEPLOY_ROLE_ARN is set, this workflow skips itself instead of failing.

on:
  workflow_run:
    workflows: ['Continuous Integration & Production Validation']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build image and deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      APP_URL: ${{ vars.APP_URL }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'nexora' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check AWS configuration
        id: config
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || [ -z "$AWS_REGION" ] || [ -z "$ECR_REPOSITORY" ]; then
            echo "::notice::AWS deployment is not configured yet. Run infra/aws/bootstrap.sh and add the repository variables it prints."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tested commit
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Sign in to AWS (OIDC)
        if: steps.config.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        if: steps.config.outputs.ready == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.config.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        if: steps.config.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.SHA }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to the app server
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:Project,Values=$PROJECT_NAME" "Key=tag:Role,Values=app" \
            --parameters "{\"commands\":[\"/opt/nexora/deploy.sh $SHA\"],\"executionTimeout\":[\"600\"]}" \
            --timeout-seconds 600 \
            --comment "Deploy ${SHA:0:7} from GitHub Actions run ${{ github.run_id }}" \
            --query Command.CommandId --output text)
          echo "Systems Manager command: $COMMAND_ID"

          for _ in $(seq 1 90); do
            sleep 10
            STATUSES=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query 'CommandInvocations[].Status' --output text)
            echo "Status: ${STATUSES:-waiting for the server}"
            if [ -n "$STATUSES" ] && ! echo "$STATUSES" | grep -qE 'Pending|InProgress|Delayed'; then break; fi
          done

          COUNT=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query 'length(CommandInvocations)' --output text)
          if [ "$COUNT" = "0" ]; then
            echo "::error::No running app server matched tags Project=$PROJECT_NAME, Role=app. Check the Auto Scaling group."
            exit 1
          fi

          FAILED=0
          for IID in $(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query 'CommandInvocations[].InstanceId' --output text); do
            echo "::group::Output from $IID"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$IID" \
              --query '[Status, StandardOutputContent, StandardErrorContent]' --output text || true
            echo "::endgroup::"
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$IID" --query Status --output text)
            [ "$STATUS" = "Success" ] || FAILED=1
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::The deploy did not succeed. The server kept or restored the previous version; see the output above."
            exit 1
          fi

      - name: Smoke test
        if: steps.config.outputs.ready == 'true' && env.APP_URL != ''
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 "$APP_URL/health/ready" >/dev/null; then
              echo "Healthy at $APP_URL"
              echo "### Deployed \`${SHA:0:7}\` to $APP_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$APP_URL/health/ready did not answer with 200 within 5 minutes."
          exit 1
