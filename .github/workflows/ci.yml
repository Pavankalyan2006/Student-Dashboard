name: Continuous Integration & Production Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Type Check (TypeScript Validation)
        run: npx tsc --noEmit

      - name: Execute Full Test Suite
        run: npm test -- --run

      - name: Production Bundle Compilation
        run: npm run build

      - name: Verify Dockerfile Build
        run: docker build -t btech-ai-platform:ci .
